<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050506">
<title>Movie Quiz – Responsive Test</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#050506;color:#ead9b5;font-family:system-ui,sans-serif}
.mq-preview-loader{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box;background:#050506}
.mq-preview-loader strong{display:block;font-size:18px;letter-spacing:.08em;text-transform:uppercase}
.mq-preview-loader span{display:block;margin-top:8px;font-size:13px;opacity:.72}
</style>
</head>
<body>
<div class="mq-preview-loader"><div><strong>Movie Quiz</strong><span>Načítám responzivní testovací verzi…</span></div></div>
<script>
(async()=>{
  try{
    const response=await fetch('../index.html?mqResponsiveSource='+Date.now(),{cache:'no-store'});
    if(!response.ok)throw new Error('HTTP '+response.status);
    let html=await response.text();

    const previewPrefix=`
<base href="../">
<meta name="robots" content="noindex,nofollow">
`;
    html=html.replace(/<head(\s[^>]*)?>/i,match=>match+previewPrefix);

    const responsiveTail=`
<link rel="stylesheet" href="test-responsive/css/responsive-v1.css?v=1.0.0">
<link rel="stylesheet" href="test-responsive/css/responsive-v1-tablet.css?v=1.0.0">
<link rel="stylesheet" href="test-responsive/css/responsive-v1-motion.css?v=1.0.0">
<link rel="stylesheet" href="test-responsive/css/responsive-v1-large.css?v=1.0.0">
<link rel="stylesheet" href="test-responsive/css/responsive-v1-cover.css?v=1.0.1">
<link rel="stylesheet" href="test-responsive/css/responsive-v2-full-bleed.css?v=2.0.0">
<link rel="stylesheet" href="test-responsive/css/responsive-exterior-v9.css?v=9.0.0">
<link rel="stylesheet" href="test-responsive/css/responsive-exterior-v9-3-final.css?v=9.5.0">
<link rel="stylesheet" href="test-responsive/css/responsive-exterior-v9-6-final.css?v=9.6.0">
<script defer src="test-responsive/js/responsive-runtime-v3.js?v=3.0.0"><\/script>
<script defer src="test-responsive/js/responsive-exterior-v9-6-controller.js?v=9.6.0"><\/script>
`;
    html=html.replace(/<\/head>/i,responsiveTail+'</head>');
    html=html.replace(/<title>Movie Quiz<\/title>/i,'<title>Movie Quiz – Responsive Test</title>');
    html=html.replace(/<body class="([^"]*)"/i,'<body class="$1 mq-responsive-preview"');
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.body.innerHTML='<div class="mq-preview-loader"><div><strong>Testovací verzi se nepodařilo načíst</strong><span>'+String(error&&error.message||error)+'</span></div></div>';
  }
})();
</script>
</body>
</html>
